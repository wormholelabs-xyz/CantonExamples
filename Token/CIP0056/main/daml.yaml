# The uploadable CIP-0056 token example: a singleton, multi-instrument coin
# factory (`CoinFactory`) implementing the Splice Token Standard v1
# interfaces -- `BurnMintFactory`, `TransferFactory`, `AllocationFactory` --
# plus the `Coin` holding template they produce. Templates only, no
# daml-script, so it can be uploaded to a participant.
sdk-version: 3.5.1
name: token-cip0056
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
build-options:
  # Daml-LF 2.3 (Protocol Version 35).
  - --target=2.3
data-dependencies:
  - ../../../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../../../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../../../dars/splice-api-token-allocation-v1-1.0.0.dar
  - ../../../dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - ../../../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../../../dars/splice-api-token-burn-mint-v1-1.0.0.dar
