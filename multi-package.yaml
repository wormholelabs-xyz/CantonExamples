# Root multi-package project for the CantonExamples repo. Each example is a
# pair of sibling packages: a production package (templates only, uploadable,
# no daml-script) and a `-test` package (daml-script, data-depends on the
# production DAR). All packages share the vendored DARs under /dars (see
# dars/README.md) via relative data-dependencies, so `dpm build --all` from
# the repo root builds every example in dependency order.
packages:
  - ./tokens/cip0056
  - ./tokens/cip0056-test
  # - ./tokens/cip0112
  # - ./tokens/cip0112-test
