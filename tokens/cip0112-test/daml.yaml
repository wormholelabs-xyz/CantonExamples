# Test package: Daml Scripts that exercise the CIP-0112 example templates
# (Token Standard v1+v2). Kept separate from the production package so
# daml-script stays out of the uploadable token-cip0112 DAR.
#
# It data-depends on the locally built token-cip0112 DAR plus the vendored
# Splice v1+v2 token-standard API DARs. The root multi-package.yaml ensures
# the production package is built first.
sdk-version: 3.5.1
name: token-cip0112-test
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
build-options:
  # Daml-LF 2.3 (Protocol Version 35), matching token-cip0112.
  - --target=2.3
  # TestCoinAuthenticity defines a ForgedHolding template implementing the
  # Holding interface -- and TestCoinAllocationV2 defines forged AllocationV2
  # templates -- inside this daml-script package deliberately; they must
  # never ship in a production DAR.
  - -Wno-template-interface-depends-on-daml-script
data-dependencies:
  - ../cip0112/.daml/dist/token-cip0112-0.1.0.dar
  - ../../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../../dars/splice-api-token-allocation-v1-1.0.0.dar
  - ../../dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - ../../dars/splice-api-token-burn-mint-v1-1.0.0.dar
  - ../../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../../dars/splice-api-token-holding-v2-1.0.0.dar
  - ../../dars/splice-api-token-allocation-v2-1.0.0.dar
  - ../../dars/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../../dars/splice-api-token-transfer-instruction-v2-1.0.0.dar
